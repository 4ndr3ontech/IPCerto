<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato — IPCerto</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
        }
        .page-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .top-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
        }
        .top-card img {
            height: 36px;
            margin-bottom: 16px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0284c7;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: #0369a1;
        }
        .content-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
            margin-bottom: 8px;
        }
        hr {
            border: none;
            height: 1px;
            background: #e2e8f0;
            margin: 24px 0;
        }
        p {
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #0284c7;
            background: #ffffff;
        }
        .submit-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #0369a1;
        }
        .feedback {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .feedback.success {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid #34d399;
            color: #065f46;
            display: block;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- Card Superior com Logo e Botão Voltar -->
        <div class="top-card">
            <img src="../assets/logotipo.png" alt="IPCerto">
            <div>
                <a href="../" class="back-btn">← Voltar ao Início</a>
            </div>
        </div>

        <!-- Card de Conteúdo -->
        <div class="content-card">
            <h1>Contato</h1>
            <hr>
            <p>Tem alguma sugestão, dúvida sobre as ferramentas ou encontrou algum problema? Entre em contato com a nossa equipe preenchendo o formulário abaixo.</p>

            <form id="contact-form">
                <div class="form-group">
                    <label>Seu Nome</label>
                    <input type="text" id="name" placeholder="Insira seu nome" required>
                </div>
                <div class="form-group">
                    <label>Seu E-mail</label>
                    <input type="email" id="email" placeholder="exemplo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label>Mensagem</label>
                    <textarea id="msg" rows="5" placeholder="Escreva sua mensagem..." required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="send-btn">Enviar Mensagem</button>
                <div id="feedback" class="feedback">✔ Mensagem enviada com sucesso! Entraremos em contato em breve.</div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('send-btn');
            const feedback = document.getElementById('feedback');
            
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            setTimeout(() => {
                feedback.classList.add('success');
                this.reset();
                btn.disabled = false;
                btn.textContent = 'Enviar Mensagem';
                
                setTimeout(() => {
                    feedback.classList.remove('success');
                }, 5000);
            }, 1000);
        });
    </script>
</body>
</html>
